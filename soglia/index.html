<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOINEME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Tutti i testi visibili arrivano da testi.js: qui solo la forma */
:root{
  --night:#141517;
  --ink:#ece6da;
  --ink-soft:#b9b2a5;
  --ochre:#b7894f;
  --warm:#ffb877;
  --cold:#d6dde0;
  --panel:rgba(20,21,23,.62);
  --line:rgba(236,230,218,.16);
  --display:"Fraunces",Georgia,serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));width:360px;max-height:calc(100% - 28px);overflow-y:auto;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;transition:transform .5s cubic-bezier(.7,0,.2,1),opacity .5s;scrollbar-width:thin}
.panel.closed{transform:translateX(calc(-100% - 30px));opacity:0;pointer-events:none}
.toggle{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));z-index:5;font:600 12px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;display:none}
.toggle.on{display:block}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:var(--display);font-weight:300;font-size:22px;letter-spacing:.06em;margin:0}
.mode{display:flex;gap:6px}
.btn{font:600 12.5px var(--body);color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--night);border-color:var(--ink)}
.btn.primary{background:var(--warm);color:#1a1209;border-color:var(--warm)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px var(--body);color:var(--ink);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--night)}
.card{border-top:1px solid var(--line);padding-top:12px}
.card h2{font-family:var(--display);font-weight:500;font-size:21px;margin:0}
.card .stato{font-family:var(--display);font-style:italic;font-size:15px;color:var(--ochre);margin:2px 0 10px}
.card p{font-size:14px;line-height:1.58;margin:0 0 9px}
.card .formula{font-size:12.5px;letter-spacing:.03em;color:var(--warm)}
.card .nota{font-family:var(--display);font-style:italic;color:var(--ink-soft)}
.sect{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.sect h3{font-family:var(--display);font-weight:500;font-size:16px;margin:0}
select{width:100%;font:13.5px var(--body);color:var(--ink);background:rgba(20,21,23,.8);border:1px solid var(--line);border-radius:8px;padding:8px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.steps li{font-size:12.5px;line-height:1.4;color:var(--ink-soft);opacity:.28;transition:opacity .5s}
.steps li.on{opacity:1}
.steps li b{color:var(--ink);font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap}
label.slider{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-soft)}
input[type=range]{width:100%;accent-color:var(--ochre)}
.labels{position:fixed;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-100%);font:500 12px var(--body);color:var(--ink);background:rgba(20,21,23,.55);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap;pointer-events:auto;cursor:pointer}
.lab.small{font-size:11px;padding:2px 7px;color:var(--ink-soft)}
.lab:hover{border-color:var(--warm);color:var(--warm)}
.qtag{position:fixed;transform:translate(-50%,-100%);font-family:var(--display);font-size:18px;color:var(--ink);text-align:center;pointer-events:none;opacity:0;transition:opacity .5s;text-shadow:0 1px 12px #000;max-width:340px}
.qtag.on{opacity:1}
.qtag i{display:block;font-size:15px;color:var(--warm);font-style:italic}
.domanda{position:fixed;left:50%;top:22%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity 1.4s;max-width:min(820px,calc(100% - 40px))}
.domanda.on{opacity:1}
.domanda span{display:block;font-family:var(--display);font-weight:300;font-size:clamp(28px,4vw,46px);letter-spacing:.02em;color:var(--ink);text-shadow:0 2px 24px rgba(0,0,0,.65)}
.domanda i{display:block;margin-top:12px;font-family:var(--display);font-size:clamp(18px,2.2vw,26px);color:var(--warm);opacity:0;transition:opacity 1.2s;text-shadow:0 1px 16px rgba(0,0,0,.7)}
.domanda.risposta i{opacity:1}
@media (min-width:701px){.domanda{left:calc(50% + 190px)}}
.sub{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(760px,calc(100% - 420px));font-family:var(--display);font-size:18px;line-height:1.45;text-align:center;color:var(--ink);text-shadow:0 1px 10px #000;opacity:0;transition:opacity .4s;pointer-events:none}
.sub.on{opacity:1}
.hint{position:fixed;right:18px;bottom:18px;font-size:12px;color:var(--ink-soft);display:none}
.attraversa .hint{display:block}
.loader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--night);transition:opacity 1s}
.loader.done{opacity:0;pointer-events:none}
.loader .bar{width:min(260px,70vw);height:2px;background:var(--line)}
.loader .bar span{display:block;height:100%;width:100%;background:var(--warm);transform:scaleX(.03);transform-origin:left;transition:transform .4s}
.loader p{font-family:var(--display);font-style:italic;color:var(--ink-soft);margin:0;text-align:center;max-width:420px}
@media (max-width:700px){
  .panel{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:46%}
  .panel.closed{transform:translateY(calc(100% + 30px))}
  .toggle{top:auto;bottom:12px}
  .sub{max-width:calc(100% - 32px);bottom:auto;top:16px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){.panel,.qtag,.sub,.steps li,.loader{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="labels" id="labels"></div>
<div class="qtag" id="qtag"></div>
<div class="domanda" id="domanda"><span id="dq"></span><i id="dr"></i></div>
<div class="sub" id="sub" aria-live="polite"></div>
<button class="toggle" id="openPanel"></button>
<aside class="panel" id="panel">
  <div class="head"><h1 id="titolo"></h1><button class="btn" id="closePanel"></button></div>
  <div class="mode"><button class="btn" id="mRacconta" aria-pressed="true"></button><button class="btn" id="mAttraversa" aria-pressed="false"></button></div>
  <div class="chips" id="chips"></div>
  <div class="card" id="card" aria-live="polite"></div>
  <div class="sect">
    <h3 id="tVoci"></h3>
    <select id="voceSel"></select>
    <div class="row"><button class="btn primary" id="voceGo"></button></div>
    <ol class="steps" id="steps"></ol>
  </div>
  <div class="sect">
    <h3 id="tAppoggi"></h3>
    <div class="row" id="appoggi"></div>
    <label class="slider"><span id="lQuota"></span><input type="range" id="quota" min="0" max="1" step="0.01" value="0.5"></label>
    <label class="slider"><span id="lAmpiezza"></span><input type="range" id="ampiezza" min="0" max="1" step="0.01" value="0.5"></label>
    <label class="slider"><span id="lValenza"></span><input type="range" id="valenza" min="0" max="1" step="0.01" value="0.5"></label>
    <label class="slider"><span id="lAttivazione"></span><input type="range" id="attivazione" min="0" max="1" step="0.01" value="0.4"></label>
  </div>
  <div class="row"><button class="btn" id="voce" aria-pressed="true"></button><button class="btn" id="suono" aria-pressed="false"></button></div>
</aside>
<div class="hint" id="hint"></div>
<div class="loader" id="loader"><div class="bar"><span id="loadBar"></span></div><p id="loadMsg"></p></div>
<script type="module" src="./main.js"></script>
</body>
</html>
