<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Il compagno · proposte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--night:#141517;--ink:#ece6da;--soft:#b9b2a5;--warm:#ffb877;--line:rgba(236,230,218,.16);color-scheme:dark}
html,body{height:100%;margin:0;background:#9d978d;color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;overflow:hidden;touch-action:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cap{position:fixed;transform:translate(-50%,0);text-align:center;pointer-events:none;width:min(180px,19vw)}
@media (max-width:700px){.cap span{display:none}.cap b{font-size:15px}}
.cap b{display:block;font-family:Fraunces,Georgia,serif;font-weight:500;font-size:22px;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.cap span{display:block;font-size:12.5px;line-height:1.4;color:var(--ink);opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;background:rgba(20,21,23,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;padding:6px}
.bar button{font:600 12.5px "Instrument Sans",sans-serif;color:var(--ink);background:transparent;border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
h1{position:fixed;top:14px;left:18px;margin:0;font-family:Fraunces,Georgia,serif;font-weight:300;font-size:20px;letter-spacing:.04em;text-shadow:0 1px 10px rgba(0,0,0,.5)}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<h1>Il compagno · cinque proposte</h1>
<div id="caps"></div>
<div class="bar" id="bar">
  <button data-m="0" aria-pressed="false">Com'è</button>
  <button data-m="1" aria-pressed="true">Fuori: scuro</button>
  <button data-m="2" aria-pressed="false">Dopo la Soglia: luce</button>
</div>
<script type="module" src="./daemon.js"></script>
</body>
</html>
